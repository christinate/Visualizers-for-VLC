; Copy to the VLC Visualizers profile directory to override packaged settings.
; Changes take effect the next time this visualizer opens.

[camera]
seconds=0                 ; 0 uses the Camera mode duration in Visualizers Settings
transition_fraction=0.15  ; crossfade over this fraction of each camera's time
speed=3                   ; travel speed in world units per second
clearance=3               ; distance to keep above the strongest terrain

[height]
enabled=true
peak_percent=200          ; 200 is twice the baseline height above the ground
return_seconds=0.5

[width]
enabled=true
peak_percent=200          ; 200 is twice the baseline width from the valley center
return_seconds=0.5

[palette]
beats_per_change=0        ; 0 uses the Beats between color changes setting

[flyover]
enabled=true
height_effect=true
width_effect=false

[underside]
enabled=true
height_effect=false
width_effect=false

[sidewall]
enabled=true
height_effect=false
width_effect=true

[tunnel]
enabled=true
height_effect=false
width_effect=false

[ridge]
enabled=true
height_effect=true
width_effect=false

[survey]
enabled=true
height_effect=true
width_effect=false

[skimmer]
enabled=true
height_effect=true
width_effect=false

[reverse_bank]
enabled=true
height_effect=false
width_effect=true
