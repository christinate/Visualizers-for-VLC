; Copy to the VLC Visualizers profile directory and reopen Beach after editing.
; Distances are in scene units, rates are per second, and hue wraps over 0–1.

[camera]
seconds=24
height=5.4
speed=2
focal=1.28
look_down=0.28
transition_fraction=0.18

[shoreline]
enabled=true             ; follow the shoreline with ocean left and sand right

[over_water]
enabled=true

[promenade]
enabled=true

[shore_facing]
enabled=true             ; face the sand from the water at a low angle

[overhead_shore]
enabled=true             ; water at bottom, sand at top

[ocean_facing]
enabled=true             ; face the water from the sand at a low angle

[overhead_ocean]
enabled=true             ; sand at bottom, water at top

[diagonal_shore]
enabled=true

[diagonal_ocean]
enabled=true

[turtle_follow]
enabled=true             ; stays with the turtle through the dive and resurfacing
turtle=1                 ; choose turtle 1, 2, or 3
distance=3.05

[waves]
enabled=true
minimum_interval=0.3
maximum_interval=0.7
travel_seconds=1.5
retreat_seconds=1.4
ocean_distance=24
shore_runup=1.8
return_distance=9
crest_width=0.8
audio_advance=2
waveform_depth=2.4

[breaker]
enabled=true
seconds=1.45
strength=1

[spray]
seconds=1.28
height=5.2
droplets=112
far_distance=34
near_distance=5
approach_beats=5          ; number of rock impacts from farthest to nearest
beats_per_impact=4
rainbow_chance=0.19
reset_after_seconds=2.4

[offshore_swells]
height=2.15               ; 0 disables the distant swells
distance=21              ; distance seaward before the swell builds
wavelength=20
speed=1.2

[water]
clarity=0.8               ; visibility through the shallows
caustic_strength=0.92
surface_chop=0.82
impact_strength=1        ; height and lighting response to rain and rock spray

[ocean_life]
dolphins=true             ; allows timed jumps and the D-key preview
dolphin_interval=300     ; wait for the next beat once the interval elapses
dolphin_jump_seconds=2.4
fish=true
fish_interval=60
fish_jump_seconds=1.15
turtles=true
turtle_speed=0.45
turtle_surface_seconds=65 ; typical time between dives, staggered by individual
turtle_dive_seconds=30    ; includes descent and resurfacing, 0 disables dives
turtle_dive_depth=2.8

[environment]
seed=719
density=0.86
detail=1                 ; shoreline material and small geometry detail
audio_motion=1
spacing=6.8
horizon=105
shore_bend=1.45
animals=true
houses=true
trees=true
rocks=true
grass=true

[landscape]
dune_height=0.83
sky_color=1.05
sand_texture=0.24

[beach_chair]
enabled=true
interval=60              ; seconds between visits
visible_seconds=16
head_bob=0.17

[mountains]
enabled=true
setback=21               ; begin on the inland side behind the buildings
height=21
width=43
audio_motion=0.75

[buildings]
return_seconds=0.46
growth=0.29
shimmy=0.33

[shore_motion]
speed=0.22
amount=0.28

[rain]
enabled=true
splash_on_props=true
fall_seconds=0.68
splash_seconds=0.65
horizon_distance=92
area_width=39
streak_length=0.64
drop_height=18
camera_clearance=4       ; minimum vertical gap above the highest enabled camera
prop_splash_chance=0.22

[low_notes]
enabled=true
minimum_hz=45
maximum_hz=250
threshold=0.012
drops_per_second=14
splash_radius=0.55

[high_notes]
enabled=true
minimum_hz=1700
maximum_hz=9500
threshold=0.006
drops_per_second=20
splash_radius=0.22

[palette]
enabled=true
hue=0.52
seconds=60
beats_per_change=4
hue_step=0.137
fade_seconds=0.34
