; Copy to the VLC Visualizers profile directory and reopen UnderSea after editing.
; Intervals and durations are in seconds. Space previews one enabled event at a time.
; C switches views and L holds or releases the current view.

[camera]
aquarium=true
glide=true
seconds=35                  ; automatic camera changes, 0 for C only
transition_fraction=0.18
drift_speed=0.19
focal=1.25

[reef]
seed=0                      ; 0 picks a different reef when the scene opens
coral_count=14
seahorses=4
detail=1.0
connectivity=0.72            ; fraction of nearby colonies joined by living coral

[kelp]
enabled=true
count=12
break_interval=125
drift_seconds=12
growth_seconds=120
waveform_bend=0.85

[current]
reversal_seconds=15          ; direction alternates smoothly every 10 to 20 seconds
strength=1.0
audio_influence=0.26         ; slow waveform envelope shapes the current's strength

[fish]
per_school=6                ; 0 hides the fish schools
speed=0.8
beat_speedup=2.1

[dolphins]
enabled=true
interval=410
duration=13

[whale]
enabled=true
interval=2100
duration=24

[turtle]
enabled=true
interval=600
duration=22

[water]
caustic_strength=0.87
caustic_speed=0.63           ; reach of the drifting caustics during each sweep
surface_refraction=1.0
bubble_rate=0.42

[palette]
enabled=true
hue=0.53
fade_seconds=0.85
seconds=60
beats_per_change=8
hue_step=0.08
